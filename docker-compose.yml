name: glw

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4.13
    container_name: mysql
    mem_limit: 600m
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: glw
      # 首次初始化时允许后端容器以 root 连接；已有数据卷不会重复执行。
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - /data/mysql/data:/var/lib/mysql
      - ./initdb/glw.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./initdb/full_data.sql:/docker-entrypoint-initdb.d/02-full-data.sql:ro
    networks:
      - glw-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.2.11
    container_name: redis
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}" ]
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - /data/redis:/data
    networks:
      - glw-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 12

  silo:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: silo
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - /data/silo/data:/data
    networks:
      - glw-network
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 12


  glw-backend:
    image: ${BACKEND_IMAGE:-glw-backend:1.0.0}
    container_name: glw-backend
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://silo:9000}
      # 浏览器访问 MinIO 的地址，例如 https://43.142.173.92:9443
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-glw}
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m}"
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - glw-network
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/users/login-key" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s


  glw-web:
    image: ${WEB_IMAGE:-glw-web:1.0.0}
    container_name: glw-web
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      glw-backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    volumes:
      - ./glw-web/ssl:/etc/nginx/ssl:ro
      - ./glw-web/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - glw-network
    healthcheck:
      test: [ "CMD", "curl", "-fsSk", "-o", "/dev/null", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  glw-network:
    name: glw-network

