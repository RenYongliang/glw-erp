name: build-images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 镜像名必须小写；GitHub 用户名可能包含大写字母。
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./glw-backend
          file: ./glw-backend/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/glw-backend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/glw-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./glw-web
          file: ./glw-web/Dockerfile.ci
          push: true
          build-args: |
            VITE_AUTH_MODE=backend
            VITE_API_BASE_URL=/api
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/glw-web:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/glw-web:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
