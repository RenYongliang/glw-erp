server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: glw-backend
  profiles:
    default: mock
  datasource:
    # 占位配置；mock profile 不初始化 DataSource。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/glw?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:glw_mock}
    password: ${DB_PASSWORD:mock-password-change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:mock-password-change-me}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 3s
      timeout: 3s
      repositories:
        enabled: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.glw.backend.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
app:
  jwt:
    issuer: glw-backend
    # 真实 profile 必须设置该变量；mock profile 单独提供演示密钥。
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 8h
    remember-ttl: 7d
  security:
    # Method + path. All other requests require an accessToken.
    whitelist:
      - method: GET
        path: /api/users/login-key
      - method: POST
        path: /api/users/login
      - method: POST
        path: /api/users/token
      - method: POST
        path: /api/users/refresh-token
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
logging:
  level:
    root: INFO
    com.glw.backend: INFO
