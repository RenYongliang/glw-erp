server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # #让 Spring Boot 应用信任并解析反向代理（如 Nginx、网关）传来的 X-Forwarded-* 头，从而还原客户端的真实 IP、协议（http/https）、主机和端口‌。
  # 默认情况下 Spring Boot 会忽略这些头，导致 request.getRemoteAddr() 拿到代理的 IP、request.getScheme() 误判为 http，进而引发重定向到 http、跨域、生成错误的绝对 URL 等问题
  forward-headers-strategy: framework
spring:
  application:
    name: glw-backend
  profiles:
    default: mock
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池的最大连接数
      maximum-pool-size: 20
      # 最小空闲连接数，不会因为 idle-timeout 到了被回收，但会因为 max-lifetime 被回收，
      # 被回收后 hikari 会重新创建 minimum-idle 个新连接，尽量维持始终存在 minimum-idle 个空闲连接
      minimum-idle: 2
      # 连接最长存活时间，所有连接存活时长到达 max-lifetime 就会被回收，如果连接当前正在工作，那么会等待工作执行完毕再回收
      max-lifetime: 1500000
      # 空闲连接最大存活时间，此处空闲连接不包括 minimum-idle
      idle-timeout: 600000
      # 空闲连接保活间隔（毫秒）
      # Hikari 定期检查连接池中的空闲连接，避免连接因长时间空闲 被 MySQL（wait_timeout）或其他中间设备提前关闭。
      # 白话讲就是当hikari的空闲存活时间 > Mysql自身的空闲存活时间时，防止某个连接由于一直空闲先被Mysql回收了，所以要假装工作一下让Mysql觉得这个连接还在工作没有空闲，就不会被回收
      # 生产实践中最好要配置 hikari的空闲存活时间 < Mysql自身的空闲存活时间时
      # 如果连接有效，则完成保活操作，重置 MySQL 的空闲计时；
      # 如果连接失效，则淘汰该连接，后续按需创建新连接。
      keepalive-time: 180000
      # 获取连接超时时间
      connection-timeout: 5000
      # 验证连接超时时间
      validation-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      connect-timeout: 3s
      timeout: 3s
      repositories:
        enabled: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.glw.backend.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
app:
  jwt:
    issuer: glw-backend
    # 真实 profile 必须设置该变量；mock profile 单独提供演示密钥。
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 8h
    remember-ttl: 7d
  security:
    # Method + path. All other requests require an accessToken.
    whitelist:
      - method: GET
        path: /api/users/login-key
      - method: POST
        path: /api/users/login
      - method: POST
        path: /api/users/token
      - method: POST
        path: /api/users/refresh-token
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  minio:
    # 附件对象存储；桶保持私有，下载使用短时效预签名地址。
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    # 浏览器访问 MinIO 的地址；Docker 内部 endpoint 为 silo:9000 时，测试/生产环境需设为公网或反向代理地址。
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:glw}
    # 预签名下载地址有效期。
    presign-ttl: 24h
    max-file-size: 10MB
    allowed-extensions: pdf,jpg,jpeg,png,xlsx,xls,doc,docx
  finance:
    # 对账单模板文件目录；模板文件不存库，库里只存 file_key。
    template-dir: ${STATEMENT_TEMPLATE_DIR:${user.home}/glw/statement-templates}
    default-unit: ${STATEMENT_DEFAULT_UNIT:pcs}
    # 可视化 PDF 模板使用的中文字体；留空时自动查找系统字体。
    pdf-font: ${STATEMENT_PDF_FONT:}
    # 我方抬头，所有模板共用，避免每家模板重复维护。
    company:
      name: ${COMPANY_NAME:深圳光联微电子有限公司}
      tax-no: ${COMPANY_TAX_NO:91440300349827035R}
      bank-name: ${COMPANY_BANK_NAME:中国工商银行股份有限公司深圳深圳湾支行}
      bank-account: ${COMPANY_BANK_ACCOUNT:4000027709200986297}
      phone: ${COMPANY_PHONE:13713956403}
      contact: ${COMPANY_CONTACT:黄宇}
logging:
  level:
    root: INFO
    com.glw.backend: INFO
  # 面向服务器直接查看的可读格式：时间、级别、线程、类名、消息。
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
