# 测试环境：所有连接信息与密钥由启动环境（Docker/envs/dev.env）提供，仓库不保存默认凭据。
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}

app:
  jwt:
    secret: ${JWT_SECRET}
  minio:
    # 测试环境由容器启动参数传入，避免把真实密钥写入仓库。
    endpoint: ${MINIO_ENDPOINT}
    # 浏览器下载地址；为空时退回内部 endpoint（仅适合本机直连 MinIO）。
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
