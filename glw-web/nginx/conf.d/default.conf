server {
    listen 80;
    server_name 43.142.173.92;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 43.142.173.92;

    ssl_certificate     /etc/nginx/ssl/glw.crt;
    ssl_certificate_key /etc/nginx/ssl/glw.key;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://glw-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	
	# 将浏览器访问的原始域名转发给后端。
	# 不配置时，Nginx 默认会把 Host 改成后端地址，例如 glw-backend:8080；
	# 配置后后端感知到的 Host 才是 43.142.173.92。
	# $host 不包含端口，端口由 X-Forwarded-Port 单独传递。
	proxy_set_header Host $host;

	# 传递浏览器访问 Nginx 时使用的原始协议。
	# HTTPS 在 Nginx 终止后，Nginx 到后端通常是 HTTP；
	# 该头用于让后端把 request.getScheme() 还原为 https，
	# 避免把同源 HTTPS 请求误判为跨域，也影响重定向和安全 Cookie 判断。
	proxy_set_header X-Forwarded-Proto $scheme;

	# 传递浏览器访问的原始域名。
	# 与 Host 配合使用，兼容 Spring/Tomcat 及各类框架的 forwarded headers 处理；
	# Spring 的 ForwardedHeaderFilter 会优先用该头还原 request.getServerName()。
	# 与 Host 保持同值，避免不同组件读取到不一致的域名。
	proxy_set_header X-Forwarded-Host $host;

	# 传递浏览器访问的原始端口，通常是 443。
	# 用于还原 request.getServerPort()；
	# 当外部使用非默认端口（如 8443）时尤其必要，
	# 否则后端可能默认按 HTTPS 的 443 端口处理。
	proxy_set_header X-Forwarded-Port $server_port;	



	# 四项作用汇总
	# Host：让后端看到用户实际访问的公网域名，而不是 Docker 内部服务名 glw-backend。
	# X-Forwarded-Proto：让后端看到用户实际使用的协议 https，而不是 Nginx 到后端的 http。
	# X-Forwarded-Host：以标准转发头形式提供原始域名，供 Spring/Tomcat 等框架还原 serverName。
	# X-Forwarded-Port：提供原始外部端口，供后端还原 serverPort。

	# 四项配合后端：
	# server:
	#   forward-headers-strategy: framework
	# 后端就能把内部请求：http://glw-backend:8080/api/users/login 逻辑还原为：https://43.142.173.92/api/users/login
	# 这样 CORS 同源判断、重定向地址、绝对 URL 和安全 Cookie 判断都会以外部实际访问地址为准	
	
	client_max_body_size 20m;
    }
}

# MinIO 公网下载入口：浏览器只能访问公网地址，上传仍由后端走 silo:9000。
server {
    listen 9443 ssl;
    server_name 43.142.173.92;

    ssl_certificate     /etc/nginx/ssl/glw.crt;
    ssl_certificate_key /etc/nginx/ssl/glw.key;

    client_max_body_size 100m;

    location / {
        proxy_pass http://silo:9000;

        # 必须保留浏览器原始 Host（含端口），否则 MinIO 预签名会校验失败。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
